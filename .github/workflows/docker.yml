name: docker
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # montags: PokéAPI-Daten auffrischen
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pokedex:test
      - name: Smoke-Test
        run: |
          docker run -d --name pk -p 8080:80 pokedex:test
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q 'Pokédex'
          curl -fsS http://localhost:8080/data/core.json | head -c 100; echo
          curl -fsS -o /dev/null http://localhost:8080/data/learn/6.json
          curl -fsS -o /dev/null http://localhost:8080/sprites/6.png
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/greenkeeperx/pokedex:latest
            ghcr.io/greenkeeperx/pokedex:${{ github.sha }}
