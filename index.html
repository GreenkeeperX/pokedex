<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex</title>
<style>
:root{--L1:88%;--L2:22%;--bg:#fff;--fg:#1c1c1a;--m:#6b6b66;--c:#f3f3f0;--bd:#d9d9d4;--ac:#c8282e}
@media(prefers-color-scheme:dark){:root{--L1:26%;--L2:88%;--bg:#1a1a19;--fg:#ececea;--m:#a5a5a0;--c:#252524;--bd:#3b3b39;--ac:#d9484e}}
*{box-sizing:border-box}html{background:#7d161a}body{font:14px/1.45 system-ui,sans-serif;max-width:1000px;margin:8px auto;padding:10px;background:#c8282e;border:3px solid #5a1216;border-radius:18px;box-shadow:inset 0 0 0 3px #e45a5f}
header{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:3px solid #8f1d22;margin-bottom:10px}
.lens{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#d6f0ff,#2a8fe0 45%,#14548f);box-shadow:0 0 0 3px #5a1216,0 0 12px #6cc4ff}
.led{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
main{background:var(--bg);color:var(--fg);border:3px solid #5a1216;border-radius:12px;padding:12px;box-shadow:inset 0 3px 8px rgba(0,0,0,.25)}
h1{font-size:22px;margin:0;color:#fff;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 #5a1216}h2{font-size:12px;margin:18px 0 8px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--bd);padding-bottom:3px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
input,select,button{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.t{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;margin:0 3px 3px 0}
.m{color:var(--m);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:3px 4px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child{text-align:left}
.w{background:hsl(0 60% var(--L1));color:hsl(0 60% var(--L2))}.r{background:hsl(130 45% var(--L1));color:hsl(130 45% var(--L2))}
img{width:56px;height:56px}.li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}.li>div{flex:1}.li img{width:40px;height:40px}
</style>
<header><i class=lens></i><i class=led style="background:#e8453c"></i><i class=led style="background:#f2c94c"></i><i class=led style="background:#3fb950"></i><h1>Pokédex</h1></header>
<main>
<div class="m" id="st">Lade Daten aus der PokéAPI …</div>
<h2>Filter und Ziel</h2>
<div class="row">
<input id="q" placeholder="Name (deutsch oder englisch)" oninput="R()">
<select id="fm" onchange="R()"><option value="std">Nur Standardformen</option><option value="reg" selected>+ regionale Formen</option><option value="all">Alle Formen</option></select>
<select id="gm" onchange="R()"></select>
<label><input type="checkbox" id="fin" onchange="R()"> nur Endstufen</label>
<label><input type="checkbox" id="leg" onchange="R()"> ohne Legendäre</label>
<label>Basiswerte ab <input id="mb" type="number" value="0" step="20" style="width:72px" onchange="R()"></label>
</div>
<div class="row"><select id="goal"><option value="bal">Ziel: ausgewogen</option><option value="def">Ziel: Verteidigung</option><option value="off">Ziel: Angriffsabdeckung</option><option value="bst">Ziel: Stärke (Basiswerte)</option></select>
<button class="p" onclick="sg()">Beste Ergänzung vorschlagen</button><button onclick="team=[];T()">Team leeren</button></div>
<div id="sug"></div>
<h2>Team (<span id="cn">0</span>/6)</h2><div class="grid" id="tm"></div><div id="ev"></div>
<h2>Beste Attacken je Spiel</h2><div class="row"><select id="vg" onchange="if(cur)mv(cur)"></select><span class="m">Über „Attacken“ auf einer Teamkarte starten</span></div><div id="mv"></div>
<h2>Beste Typ-Attacken</h2><div class="row"><select id="ts" onchange="tb()"></select></div><div id="tbx"></div>
<h2>Pokémon suchen</h2><div id="rs"></div>
</main>
<script>
const $=s=>document.querySelector(s),B='https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/',SP='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
let E={},TN={},M=[],byId={},MV={},MC={},team=[],cur=0;
const H=[0,40,355,200,285,35,20,85,265,200,15,220,130,52,330,175,250,30,310],SA=[0,12,55,55,55,55,55,55,55,12,55,55,55,55,55,55,55,12,55];
const ty=i=>`<span class=t style="background:hsl(${H[i]} ${SA[i]}% var(--L1));color:hsl(${H[i]} ${SA[i]}% var(--L2))">${TN[i]}</span>`;
async function txt(u){try{const c=await caches.open('pk1');let r=await c.match(u);if(!r){r=await fetch(u);if(!r.ok)throw 0;await c.put(u,r.clone())}return r.text()}catch(e){return (await fetch(u)).text()}}
function csv(t){const o=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);o.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);o.push(r)}const h=o.shift();return o.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
async function init(){try{
const [pk,sp,spn,pt,ps,tn,te,mv,mn,vg]=await Promise.all(['pokemon','pokemon_species','pokemon_species_names','pokemon_types','pokemon_stats','type_names','type_efficacy','moves','move_names','version_groups'].map(n=>txt(B+n+'.csv').then(csv)));
tn.filter(r=>r.local_language_id==6&&+r.type_id<=18).forEach(r=>TN[r.type_id]=r.name);
for(let a=1;a<=18;a++){E[a]={};for(let d=1;d<=18;d++)E[a][d]=1}
te.filter(r=>+r.damage_type_id<=18&&+r.target_type_id<=18).forEach(r=>E[r.damage_type_id][r.target_type_id]=r.damage_factor/100);
const S={},par=new Set(),N={},T0={},ST={};
sp.forEach(r=>{S[r.id]={i:r.identifier,g:+r.generation_id,l:r.is_legendary==1||r.is_mythical==1};if(r.evolves_from_species_id)par.add(r.evolves_from_species_id)});
spn.forEach(r=>{if(r.local_language_id==6||(r.local_language_id==9&&!N[r.pokemon_species_id]))N[r.pokemon_species_id]=r.name});
pt.forEach(r=>(T0[r.pokemon_id]=T0[r.pokemon_id]||[])[r.slot-1]=+r.type_id);
ps.forEach(r=>(ST[r.pokemon_id]=ST[r.pokemon_id]||[])[r.stat_id-1]=+r.base_stat);
M=pk.filter(r=>T0[r.id]&&ST[r.id]&&S[r.species_id]).map(r=>{const s=S[r.species_id],sf=r.identifier.slice(s.i.length+1),st=ST[r.id];return{id:+r.id,sp:r.species_id,sf,e:r.identifier,n:(N[r.species_id]||s.i)+(sf?' ('+sf+')':''),t:T0[r.id].filter(Boolean),st,bst:st.reduce((a,b)=>a+b,0),gen:s.g,leg:s.l,fin:!par.has(r.species_id)}});
M.forEach(m=>byId[m.id]=m);
mn.forEach(r=>{if(r.local_language_id==6)(MV[r.move_id]=MV[r.move_id]||{}).n=r.name});
mv.forEach(r=>{const o=MV[r.id]=MV[r.id]||{};o.n=o.n||r.identifier;o.ty=+r.type_id;o.pow=+r.power||0;o.acc=+r.accuracy||0;o.pp=+r.pp;o.cls=+r.damage_class_id});
$('#gm').innerHTML=[9,8,7,6,5,4,3,2,1].map(g=>`<option value=${g}>bis Generation ${g}</option>`).join('');
$('#vg').innerHTML=vg.sort((a,b)=>b.order-a.order).map(v=>`<option ${v.identifier=='scarlet-violet'?'selected':''}>${v.identifier}</option>`).join('');
$('#ts').innerHTML=Object.keys(TN).map(i=>`<option value=${i}>${TN[i]}</option>`).join('');
try{team=JSON.parse(localStorage.k||'[]').filter(i=>byId[i])}catch(e){}
$('#st').textContent=M.length+' Pokémon-Formen, '+Object.keys(MV).length+' Attacken geladen (Quelle: PokéAPI, lokal zwischengespeichert)';
R();T();tb()}catch(e){$('#st').textContent='Daten konnten nicht geladen werden: '+e}}
const dm=(a,t)=>t.reduce((p,x)=>p*E[a][x],1);
function ev(A){let open=[],unc=[],cov=0,sc=0;
for(let a=1;a<=18;a++){let w=0,r=0;A.forEach(m=>{const v=dm(a,m.t);if(v>1)w++;if(v<1)r++;if(v>=4)sc-=2});if(w>r){open.push(a);sc-=2*(w-r)}if(w&&!r)sc-=2}
for(let d=1;d<=18;d++)A.some(m=>m.t.some(a=>E[a][d]>1))?cov++:unc.push(d);
return{open,unc,cov,sc,bst:A.reduce((s,m)=>s+m.bst,0)}}
const gs=(e,g)=>g=='def'?e.sc:g=='off'?e.cov*4+e.sc/4:g=='bst'?e.bst/30:e.sc+e.cov+e.bst/50;
function pool(){const f=$('#fm').value,g=+$('#gm').value,b=+$('#mb').value||0;return M.filter(m=>(f=='all'||(f=='reg'?(!m.sf||/^(alola|galar|hisui|paldea)/.test(m.sf)):!m.sf))&&m.gen<=g&&(!$('#fin').checked||m.fin)&&(!$('#leg').checked||!m.leg)&&m.bst>=b)}
const li=(m,x,b)=>`<div class=li><img src="${SP}${m.id}.png" alt=""><div><b>${m.n}</b> ${m.t.map(ty).join('')}<div class=m>Basiswerte ${m.bst}${x?' · '+x:''}</div></div>${b===0?'':`<button onclick="add(${m.id})">+ Team</button>`}</div>`;
function R(){const q=$('#q').value.toLowerCase().trim(),L=pool().filter(m=>!q||m.n.toLowerCase().includes(q)||m.e.includes(q));
$('#rs').innerHTML=`<div class=m>${L.length} Treffer${L.length>40?', zeige 40':''}</div>`+L.slice(0,40).map(m=>li(m)).join('')}
const add=i=>{if(team.length<6&&!team.includes(i))team.push(i);T()},rm=i=>{team=team.filter(x=>x!=i);T()};
function T(){try{localStorage.k=JSON.stringify(team)}catch(e){}$('#cn').textContent=team.length;const A=team.map(i=>byId[i]);
$('#tm').innerHTML=A.map(m=>`<div class=card><img src="${SP}${m.id}.png" alt=""><br><b>${m.n}</b><br>${m.t.map(ty).join('')}<div class=m>Basiswerte ${m.bst} · Atk ${m.st[1]} · SpA ${m.st[3]} · Init ${m.st[5]}</div><div class=row><button onclick="mv(${m.id})">Attacken</button><button onclick="rm(${m.id})">×</button></div></div>`).join('');
let h='';if(A.length){const e=ev(A);h=`<div class=card style="margin-top:8px"><p>Offen (Verteidigung): ${e.open.length?e.open.map(ty).join(''):'keine'}<br>Angriff: ${e.cov}/18 Typen doppelt getroffen${e.unc.length?' · nicht abgedeckt: '+e.unc.map(ty).join(''):''}<br>Summe Basiswerte: ${e.bst}</p><div style="overflow-x:auto"><table><tr><th></th>${A.map(m=>'<th>'+m.n.slice(0,7)+'</th>').join('')}</tr>`;
for(let a=1;a<=18;a++)h+=`<tr><td>${ty(a)}</td>`+A.map(m=>{const v=dm(a,m.t);return v>1?`<td class=w>${v>=4?'x4':'x2'}</td>`:v<1?`<td class=r>${v==0?'0':v<.5?'¼':'½'}</td>`:'<td></td>'}).join('')+'</tr>';h+='</table></div></div>'}
$('#ev').innerHTML=h}
function sg(){const g=$('#goal').value,A=team.map(i=>byId[i]),L=pool().filter(m=>!team.includes(m.id)&&!A.some(x=>x.sp==m.sp)).map(m=>{const e=ev(A.concat(m));return{m,e,s:gs(e,g)}}).sort((a,b)=>b.s-a.s).slice(0,12);
$('#sug').innerHTML='<div class=card>'+L.map(x=>li(x.m,`danach offen: ${x.e.open.length?x.e.open.map(ty).join(''):'keine'} · Angriff ${x.e.cov}/18`)).join('')+'</div>'}
async function mv(id){cur=id;const m=byId[id],box=$('#mv');box.innerHTML='Lade …';
try{const j=MC[id]=MC[id]||await(await fetch('https://pokeapi.co/api/v2/pokemon/'+id)).json(),vg=$('#vg').value,atk=m.st[1]>=m.st[3]?2:3,L=[];
j.moves.forEach(x=>{const d=x.version_group_details.find(v=>v.version_group.name==vg);if(!d)return;const o=MV[x.move.url.split('/').filter(Boolean).pop()];if(!o||!o.pow)return;
const stab=m.t.includes(o.ty),cl=o.cls==atk,own=new Set();m.t.forEach(a=>{for(let k=1;k<=18;k++)if(E[a][k]>1)own.add(k)});
const cv=[];for(let k=1;k<=18;k++)if(E[o.ty][k]>1&&!own.has(k))cv.push(TN[k]);
L.push({o,d,stab,cl,cv,s:o.pow*(o.acc||100)/100*(stab?1.5:1)*(cl?1:.55)})});
L.sort((a,b)=>b.s-a.s);const mt={'level-up':d=>'Level '+d.level_learned_at,machine:()=>'TM/VM',egg:()=>'Ei',tutor:()=>'Lehrer'};
box.innerHTML=`<div class=card><b>${m.n}</b> in ${vg}: ${L.length?'':'keine Angriffsattacken gefunden'}`+L.slice(0,10).map(x=>`<div class=li><div><b>${x.o.n}</b> ${ty(x.o.ty)}<span class=m>${x.o.cls==2?'physisch':'speziell'} · Stärke ${x.o.pow} · Genauigkeit ${x.o.acc||'–'} · ${(mt[x.d.move_learn_method.name]||(()=>x.d.move_learn_method.name))(x.d)}</span><div class=m>Warum: ${x.stab?'Eigentyp-Bonus, ':''}${x.cl?'passt zum stärkeren Angriffswert':'passt nicht zum stärkeren Angriffswert (abgewertet)'}${!x.stab&&x.cv.length?', trifft zusätzlich '+x.cv.slice(0,4).join(', '):''}</div></div></div>`).join('')+`<div class=m>Wertung: Stärke × Genauigkeit × Eigentyp-Bonus; Zusatzeffekte nicht bewertet.</div></div>`}
catch(e){box.textContent='Attacken konnten nicht geladen werden: '+e}}
function tb(){const t=+$('#ts').value,L=Object.values(MV).filter(o=>o.ty==t&&o.pow&&o.cls>1).sort((a,b)=>b.pow*(b.acc||100)-a.pow*(a.acc||100)).slice(0,10);
$('#tbx').innerHTML='<div class=card>'+L.map(o=>`<div class=li><div><b>${o.n}</b> <span class=m>${o.cls==2?'physisch':'speziell'} · Stärke ${o.pow} · Genauigkeit ${o.acc||'–'} · AP ${o.pp}</span></div></div>`).join('')+'<div class=m>Rang nach Stärke × Genauigkeit, ohne Zusatzeffekte und Nachteile.</div></div>'}
init();
</script>
</html>
