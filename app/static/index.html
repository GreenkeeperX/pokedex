<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>try{var t=localStorage.getItem("px.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="stick" id="stick">
  <header class="top">
    <h1><a href="#pokemon" id="home" title="Zur Liste, alles neu laden"><span class="brand">Poké</span>dex</a></h1>
    <label class="game">Spiel <select class="gamesel" aria-label="Spiel"></select></label>
    <div class="meta" id="meta"></div>
    <button class="ver" id="ver" data-act="neu" title="Was ist neu?" hidden></button>
    <div class="thm"><button id="thmBtn" data-act="thm" aria-haspopup="true" aria-expanded="false"></button><div class="thm-m" id="thmMenu" role="menu" hidden></div></div>
  </header>
  <nav id="nav"></nav>
  </div>
  <div id="neu"></div>
  <main id="main"><p class="hint">Lädt …</p></main>
</div>
<script src="js/app.js"></script>
</body>
</html>
